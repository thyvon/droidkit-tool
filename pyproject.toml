[project]
name = "droidkit"
version = "0.2.2"
description = "Modern Android device toolkit — dashboard, apps, shell, files, fastboot, licensing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DroidKit" }]
keywords = ["android", "adb", "fastboot", "pyqt", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
  "Topic :: Utilities",
]

dependencies = [
  "PySide6>=6.8",
  "pyside6-essentials>=6.8",
  "httpx>=0.28",
  "pydantic>=2.10",
  "platformdirs>=4.3",
  "cryptography>=44.0",
  "Pillow>=11.0",
  "qrcode>=8.0",
  "bakong-khqr>=0.7.0",
  "packaging>=24.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "pyinstaller>=6.11",
  "pyinstaller-hooks-contrib>=2024.11",
]

[project.scripts]
droidkit = "droidkit.app:main"

[project.urls]
Homepage = "https://github.com/thyvon/droidkit-tool"
Releases = "https://github.com/thyvon/droidkit-tool/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/droidkit"]

[tool.hatch.build.targets.sdist]
include = ["src/droidkit", "tests", "README.md", "assets"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N802/N815: Qt slots/signals/properties must be camelCase (see ARCHITECTURE.md)
ignore = ["E501", "N802", "N815"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["droidkit"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bakong_khqr.*", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
